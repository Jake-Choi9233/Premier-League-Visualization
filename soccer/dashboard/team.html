<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Details</title>
    <link rel="stylesheet" href="dashboard.css">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            margin: auto;
        }
        .team-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .team-header img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }
        .team-info {
            margin-bottom: 20px;
        }
        .team-info ul {
            list-style-type: none;
            padding: 0;
        }
        .team-info ul li {
            margin: 5px 0;
        }
        .player-list {
            margin-top: 20px;
        }
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
        }
        .player-item {
            display: grid;
            grid-template-columns: 54px 1fr;
            gap: 12px;
            align-items: center;
            padding: 12px 14px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
        }
        .player-item img {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            object-fit: cover;
        }
        .player-meta {
            display: grid;
            gap: 4px;
        }
        .player-name {
            font-weight: 600;
            color: #111827;
        }
        .player-sub {
            color: #6b7280;
            font-size: 0.9rem;
        }
        .player-stats {
            display: grid;
            gap: 2px;
            font-size: 0.9rem;
            color: #1f2937;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.5/xlsx.full.min.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="../sphere_graph/sphere.html">Sphere / Sunburst</a>
        <a href="../salary/salary.html">Wages</a>
        <a href="../salary/salary_ratio.html">Cost-effectiveness</a>
    </nav>

    <div class="container">
        <div class="team-header">
            <img id="team-logo" src="" alt="Team logo">
            <h1 id="team-name"></h1>
        </div>
        <div class="team-info">
            <ul><li><strong>Players:</strong> <span id="PI"></span></li>
                <li><strong>Total Annual Wages:</strong> <span id="squad-annual-wages"></span></li>
                <li><strong>Team Ranking:</strong> <span id="team-ranking"></span></li>
            </ul>
        </div>
        <div class="player-list">
            <h3>Team Roster:</h3>
            <div id="player-container" class="player-grid"></div>
        </div>
    </div>

    <!-- JS -->
    <script src="team.js"></script>
</body>
</html>
